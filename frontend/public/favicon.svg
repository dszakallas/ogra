<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E"/>
      <stop offset="100%" stop-color="#FECFEF"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0E6FF"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB7C5"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
    <radialGradient id="glass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E6F3FF" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Tentacles -->
  <g fill="url(#skin)" stroke="#FF7A95" stroke-width="1.5" stroke-linecap="round">
    <path d="M28 72 Q22 84 18 88 Q16 90 20 90 Q26 88 32 76"/>
    <path d="M40 78 Q38 90 36 94 Q34 96 38 96 Q44 92 48 80"/>
    <path d="M52 80 Q52 92 52 96 Q52 98 56 96 Q60 92 60 80"/>
    <path d="M72 72 Q78 84 82 88 Q84 90 80 90 Q74 88 68 76"/>
    <path d="M60 78 Q62 90 64 94 Q66 96 62 96 Q56 92 52 80"/>
  </g>

  <!-- Space suit collar -->
  <ellipse cx="50" cy="76" rx="32" ry="10" fill="url(#suit)" stroke="#D4B8FF" stroke-width="2"/>

  <!-- Space helmet back -->
  <circle cx="50" cy="46" r="34" fill="#FFFFFF" stroke="#D4B8FF" stroke-width="3"/>

  <!-- Helmet glass -->
  <circle cx="50" cy="46" r="30" fill="url(#glass)"/>

  <!-- Octopus head -->
  <path d="M32 46 Q32 26 50 26 Q68 26 68 46 Q68 60 50 60 Q32 60 32 46" fill="url(#skin)"/>

  <!-- Eyes with lashes -->
  <g fill="#4A2545">
    <ellipse cx="42" cy="44" rx="5" ry="7"/>
    <ellipse cx="58" cy="44" rx="5" ry="7"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="44" cy="42" r="2"/>
    <circle cx="60" cy="42" r="2"/>
  </g>

  <!-- Eyelashes -->
  <g stroke="#4A2545" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M37 42 Q34 38 32 36"/>
    <path d="M37 44 Q33 44 30 44"/>
    <path d="M37 46 Q34 50 32 52"/>
    <path d="M63 42 Q66 38 68 36"/>
    <path d="M63 44 Q67 44 70 44"/>
    <path d="M63 46 Q66 50 68 52"/>
  </g>

  <!-- Blush -->
  <ellipse cx="36" cy="52" rx="4" ry="2.5" fill="#FF5C8D" opacity="0.4"/>
  <ellipse cx="64" cy="52" rx="4" ry="2.5" fill="#FF5C8D" opacity="0.4"/>

  <!-- Smile -->
  <path d="M46 54 Q50 58 54 54" fill="none" stroke="#C2185B" stroke-width="2" stroke-linecap="round"/>

  <!-- Bow on helmet -->
  <g fill="#FF69B4" stroke="#C2185B" stroke-width="1">
    <ellipse cx="74" cy="24" rx="8" ry="5" transform="rotate(-30 74 24)"/>
    <ellipse cx="84" cy="24" rx="8" ry="5" transform="rotate(30 84 24)"/>
    <circle cx="79" cy="24" r="3"/>
  </g>

  <!-- Helmet reflection -->
  <path d="M34 28 Q42 22 52 22" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
