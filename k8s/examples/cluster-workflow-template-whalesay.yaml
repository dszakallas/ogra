apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: cluster-whalesay-template
  labels:
    example: "true"
  annotations:
    workflows.argoproj.io/description: "Cluster-scoped template that prints a greeting and simulates work"
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: message
        value: "Hello from cluster workflow template!"
        description: "Message to print in the workflow"
  templates:
    - name: main
      steps:
        - - name: step-say
            template: whalesay
            arguments:
              parameters:
                - name: message
                  value: "{{workflow.parameters.message}}"

    - name: whalesay
      inputs:
        parameters:
          - name: message
      script:
        image: bash:latest
        command: [bash]
        source: |
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') [CLUSTER-TEMPLATE] {{inputs.parameters.message}}"
          echo "Processing cluster-wide task..."
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') [SUCCESS] Completed."
